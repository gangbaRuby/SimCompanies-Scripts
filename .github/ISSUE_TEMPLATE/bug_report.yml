name: Bug 报告
description: 报告可以稳定复现的脚本问题。
title: "fix: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        请不要填写账号密码、Cookie、请求令牌或其他敏感信息。
  - type: input
    id: version
    attributes:
      label: 脚本版本
      description: 请填写 Tampermonkey 显示的版本号。
      placeholder: "例如：1.32.38"
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: 页面地址
      description: 请填写可复现问题的 SimCompanies 页面 URL。
      placeholder: "https://www.simcompanies.com/..."
    validations:
      required: true
  - type: dropdown
    id: feature
    attributes:
      label: 受影响功能
      options:
        - 传入合同
        - 资源市场
        - 传出合同
        - 仓库零售
        - 高管数据
        - 其他
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请从进入页面开始，按顺序描述操作。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果与控制台信息
      description: 可附截图；控制台内容请删除敏感信息。
    validations:
      required: true
  - type: checkboxes
    id: checked
    attributes:
      label: 提交前检查
      options:
        - label: 我已确认脚本已更新到当前正式版本。
          required: true
        - label: 我未包含账号、Cookie、令牌或其他敏感信息。
          required: true
